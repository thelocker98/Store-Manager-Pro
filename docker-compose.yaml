services:
  web:
    image: gitea.locker98.com/locker98/store-manager-pro:latest
    container_name: storemanagerpro-server
    restart: always
    depends_on:
       - db
    ports:
      - "1556:8080"
    environment:
      - TZ=America/New_York
      - GIN_MODE=release
      - DATA_PATH=/data
      - DB_TYPE=sqlite

    volumes:
      - ./data:/data
