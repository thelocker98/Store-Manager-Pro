services:
  web:
    image: gitea.locker98.com/locker98/store-manager-pro:v0.8.2
    container_name: storemanagerpro-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=America/New_York
      - GIN_MODE=release
      - DATA_PATH=/data
      - DB_TYPE=sqlite

    volumes:
      - ./data:/data
