<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <link rel="icon" type="image/x-icon" href="/static/icon.ico" />
        <link rel="stylesheet" href="/static/css/invoices.css" />
        <link rel="stylesheet" href="/static/css/general.css" />

        <script src="/static/javascript/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/departments.js"></script>
        <script src="/static/javascript/invoices/invoices.js"></script>
    </head>

    <body>
        <header class="app-header">
            <div class="header-left">
                <span class="logo">Store Manager Pro</span>
                <select id="departmentPageSelector" class="departmentSelector"></select>
            </div>

            <nav class="header-nav">
                <a href="/" class="nav-link">Inventory</a>
                <a href="/lists" class="nav-link">Lists</a>
                <a href="/invoices" class="nav-link">Invoices</a>

                <div class="nav-dropdown">
                    <span class="nav-link dropdown-toggle">Manage ▾</span>
                    <div class="dropdown-menu">
                        <a href="/vendors">Vendors</a>
                        <a href="/locations">Locations</a>
                        <a href="/departments">Departments</a>
                    </div>
                </div>
                <div class="nav-dropdown">
                    <span class="nav-link dropdown-toggle">Configurations ▾</span>
                    <div class="dropdown-menu">
                        <a href="/barcode" class="nav-link">Barcode</a>
                        <a href="/export" class="nav-link">Export</a>
                    </div>
                </div>
            </nav>
        </header>

        <main id="main" class="app-container">
            <h2>Invoices</h2>
            <button class="import-invoice-btn" id="addInvoiceButton" onclick="openInvoice()">
                + Import New Invoice
            </button>

            <div class="invoices-grid" id="invoiceContainers"></div>
            <!-- Invoice Popup -->
            <div id="invoicePopup" class="invoicePopup">
                <h2>Invoice Importer</h2>
                <br />
                <div>
                    <label for="popup_invoice_title">Invoice Name: </label>
                    <input type="text" id="popup_invoice_title" required />
                </div>
                <!--<div>
                    <label for="popup_invoice_type">Invoice Type: </label>
                    <select id="popup_invoice_type" required />
                </div>-->

                <br />
                <div style="display: flex; justify-content: space-between">
                    <button onclick="closeInvoice()">Cancel</button>
                    <button onclick="createNewInvoice()">Save</button>
                </div>
                <p id="invoiceError" class="errorText"></p>
            </div>

            <!-- Optional overlay for background -->
            <div
                id="invoiceOverlay"
                style="
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.3);
                    z-index: 99;
                "
                onclick="closeInvoice()"
            ></div>
        </main>
    </body>
</html>
