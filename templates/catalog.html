<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Catalog Editor</title>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/catalog/catalog.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 10px;
                border: 1px solid #ccc;
                text-align: left;
            }

            th {
                background-color: #f4f4f4;
            }

            button {
                margin-right: 5px;
            }

            input {
                padding: 5px;
            }

            /* Highlight row on hover */
            #catalogTable tbody tr:hover {
                background-color: #e0e0e0;
            }
        </style>
    </head>

    <body>
        <h1>Catalog Editor</h1>
        <button type="button" onclick="window.location.href='/'">Home</button>

        <input
            type="text"
            id="searchCatalog"
            placeholder="Search catalog..."
            oninput="searchCatalogEntries()"
            style="margin-bottom: 10px; padding: 5px; width: 300px"
        />
        <button onclick="resetSearch()">Reset Search</button>

        <!-- Catalog Table -->
        <h2>Catalog Items</h2>
        <button onclick="openAddCatalogPopup()">Add Catalog Entry</button>
        <table id="catalogTable">
            <thead>
                <tr>
                    <th>UPC</th>
                    <th>Invoice Number</th>
                    <th>Name</th>
                    <th>Brand</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Item Info Popup -->
        <div
            id="infoPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Item Details</h2>

            <div id="infoContent"></div>

            <br />
            <button id="infoEditBtn">Edit</button>
            <button id="infoDeleteBtn">Delete</button>
            <button onclick="closeInfo()">Close</button>
        </div>

        <!-- Info overlay -->
        <div
            id="infooverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeInfo()"
        ></div>


        <!-- CatalogPopup -->
        <div
            id="catalogPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2 id="catalogPopupHeader"></h2>

            <form id="catalogEntryFormPopup">
                <input type="hidden" id="popup_catalog_id" />

                <div>
                    <label for="popup_catalog_upc">UPC</label>
                    <input type="text" id="popup_catalog_upc" />
                </div>

                <div>
                    <label for="popup_catalog_invoicenumber">Invoice Number</label>
                    <input type="text" id="popup_catalog_invoicenumber" />
                </div>

                <div>
                    <label for="popup_catalog_name">Name</label>
                    <input type="text" id="popup_catalog_name" required />
                </div>

                <div>
                    <label for="popup_catalog_brand">Brand</label>
                    <input type="text" id="popup_catalog_brand" required />
                </div>

                <div class="form-actions">
                    <button type="button" onclick="closeCatalogPopup()">Cancel</button>
                    <button id="catalogEntrySubmitButton" type="submit">Add</button>
                </div>
            </form>
        </div>

        <!-- Catalog Overlay -->
        <div
            id="catalogOverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeCatalogPopup()"
        ></div>

</html>
