<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Catalog Editor</title>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/catalog/catalog.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 10px;
                border: 1px solid #ccc;
                text-align: left;
            }

            th {
                background-color: #f4f4f4;
            }

            button {
                margin-right: 5px;
            }

            input {
                padding: 5px;
            }

            /* Highlight row on hover */
            #catalogTable tbody tr:hover {
                background-color: #e0e0e0;
            }
        </style>
    </head>

    <body>
        <h1>Catalog Editor</h1>
        <button type="button" onclick="window.location.href='/'">Home</button>

        <input
            type="text"
            id="searchCatalog"
            placeholder="Search catalog..."
            oninput="searchCatalogEntries()"
            style="margin-bottom: 10px; padding: 5px; width: 300px"
        />
        <button onclick="resetSearch()">Reset Search</button>

        <!-- Add Catalog Popup -->
        <div
            id="addCatalogPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Add Catalog Entry</h2>
            <form
                id="addCatalogEntryFormPopup"
                onsubmit="addCatalogEntryPopup(event)"
            >
                <label for="popup_catalog_upc">UPC:</label><br />
                <input
                    type="text"
                    id="popup_catalog_upc"
                    placeholder="UPC"
                /><br /><br />

                <label for="popup_catalog_invoicenumber">Invoice Number:</label
                ><br />
                <input
                    type="text"
                    id="popup_catalog_invoicenumber"
                    placeholder="Invoice Number"
                /><br /><br />

                <label for="popup_catalog_name">Product Name:</label><br />
                <input
                    type="text"
                    id="popup_catalog_name"
                    placeholder="Product Name"
                    required
                /><br /><br />

                <label for="popup_catalog_brand">Product Brand:</label><br />
                <input
                    type="text"
                    id="popup_catalog_brand"
                    placeholder="Product Brand"
                    required
                /><br /><br />

                <button type="submit">Add</button>
                <button type="button" onclick="closeAddCatalogPopup()">
                    Cancel
                </button>
            </form>
        </div>

        <!-- Overlay -->
        <div
            id="addCatalogOverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeAddCatalogPopup()"
        ></div>

        <!-- Catalog Table -->
        <h2>Catalog Items</h2>
        <button onclick="openAddCatalogPopup()">Add Catalog Entry</button>
        <table id="catalogTable">
            <thead>
                <tr>
                    <th>UPC</th>
                    <th>Invoice Number</th>
                    <th>Name</th>
                    <th>Brand</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Item Info Popup -->
        <div
            id="infoPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Item Details</h2>

            <div id="infoContent"></div>

            <br />
            <button id="infoEditBtn">Edit</button>
            <button id="infoDeleteBtn">Delete</button>
            <button onclick="closeInfo()">Close</button>
        </div>

        <!-- Edit Vendor Popup -->
        <div
            id="editCatalogEntryPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Edit Catalog Entry</h2>

            <form
                id="editCatalogEntryForm"
                onsubmit="submitCatalogEntryEdit(event)"
            >
                <input type="hidden" id="editCatalogId" />

                <label for="editCatalogUPC">UPC:</label><br />
                <input
                    type="text"
                    id="editCatalogUPC"
                    placeholder="UPC"
                /><br /><br />

                <label for="editCatalogInvoiceNumber">Invoice Number:</label
                ><br />
                <input
                    type="text"
                    id="editCatalogInvoiceNumber"
                    placeholder="Invoice Number"
                /><br /><br />

                <label for="editCatalogName">Product Name:</label><br />
                <input
                    type="text"
                    id="editCatalogName"
                    placeholder="Product Name"
                    required
                /><br /><br />

                <label for="editCatalogBrand">Product Brand:</label><br />
                <input
                    type="text"
                    id="editCatalogBrand"
                    placeholder="Product Brand"
                    required
                /><br /><br />

                <button type="submit">Save</button>
                <button type="button" onclick="closeCatalogEntryEdit()">
                    Cancel
                </button>
            </form>
        </div>

        <!-- Optional overlay for background -->
        <div
            id="infooverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeInfo()"
        ></div>

        <!-- Optional overlay for background -->
        <div
            id="overlayEditor"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeCatalogEntryEdit()"
        ></div>
</html>
