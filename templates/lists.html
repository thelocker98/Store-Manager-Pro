<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <link rel="stylesheet" href="/static/css/lists.css" />
        <link rel="stylesheet" href="/static/css/general.css" />

        <script src="/static/javascript/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/lists/lists.js"></script>
    </head>

    <body>
        <header class="app-header">
            <div class="header-left">
                <span class="logo">Store Manager Pro</span>
            </div>

            <nav class="header-nav">
                <a href="/" class="nav-link">Inventory</a>
                <a href="/lists" class="nav-link">Lists</a>

                <div class="nav-dropdown">
                    <span class="nav-link dropdown-toggle">Manage ▾</span>
                    <div class="dropdown-menu">
                        <a href="/vendors">Vendors</a>
                        <a href="/locations">Locations</a>
                        <a href="/departments">Departments</a>
                    </div>
                </div>
                <div class="nav-dropdown">
                    <span class="nav-link dropdown-toggle"
                        >Configurations ▾</span
                    >
                    <div class="dropdown-menu">
                        <a href="/barcode" class="nav-link">Barcode</a>
                        <a href="/export" class="nav-link">Export</a>
                    </div>
                </div>
            </nav>
        </header>

        <main id="main" class="app-container">
            <h2>Lists</h2>
            <button class="add-list-btn" onclick="openList()">
                + Create New List
            </button>

            <div class="lists-grid" id="listsContainer"></div>
            <!-- list Popup -->
            <div id="listPopup" class="listPopup">
                <h2>List Creator</h2>
                <br />
                <div>
                    <label for="popup_list_title">List Title: </label>
                    <input type="text" id="popup_list_title" required />
                </div>

                <br />
                <div style="display: flex; justify-content: space-between">
                    <button onclick="closeList()">Cancel</button>
                    <button onclick="createNewList()">Save</button>
                </div>
                <p id="listError" class="errorText"></p>
            </div>

            <!-- Optional overlay for background -->
            <div
                id="listOverlay"
                style="
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.3);
                    z-index: 99;
                "
                onclick="closeList()"
            ></div>
        </main>
    </body>
</html>
