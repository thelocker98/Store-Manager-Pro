<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <link rel="stylesheet" href="/static/css/location.css" />
        <link rel="stylesheet" href="/static/css/general.css" />

        <script src="/static/javascript/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/location/location.js"></script>
    </head>

    <body>
        <header class="app-header">
            <div class="header-left">
                <span class="logo">Store Manager Pro</span>
            </div>

            <nav class="header-nav">
                <a href="/" class="nav-link">Inventory</a>
                <a href="/vendors" class="nav-link">Vendors</a>
                <a href="/locations" class="nav-link">Locations</a>
                <a href="/lists" class="nav-link">Lists</a>
                <a href="/barcode" class="nav-link">Barcode</a>
                <a href="/export" class="nav-link">Export</a>
            </nav>
        </header>

        <main id="main">
            <!-- Add Location Form -->
            <h2>Locations</h2>
            <form id="addLocationForm" onsubmit="addLocation(event)">
                <input
                    type="text"
                    id="location_name"
                    placeholder="Location Name"
                    required
                />
                <button type="submit">Add</button>
                <p id="locationaddError" class="errorText"></p>
            </form>

            <!-- Locations Table -->
            <h2>Locations</h2>
            <table id="locationsTable" style="min-width: 325px">
                <thead>
                    <tr>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <!-- Edit Location Popup -->
            <div
                id="editLocationPopup"
                style="
                    display: none;
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: white;
                    border: 1px solid #ccc;
                    padding: 20px;
                    z-index: 1000;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                    min-width: 300px;
                "
            >
                <h2>Edit Location</h2>
                <form
                    id="editLocationForm"
                    onsubmit="submitLocationEdit(event)"
                >
                    <input type="hidden" id="editLocationId" />

                    <label for="editLocationName">Location</label><br />
                    <input
                        type="text"
                        id="editLocationName"
                        required
                    /><br /><br />

                    <button type="button" onclick="closeLocationEdit()">
                        Cancel
                    </button>
                    <button id="locationDeleteButton" type="button">
                        Delete
                    </button>
                    <button type="submit">Save</button>
                    <p id="locationinfoError" class="errorText"></p>
                </form>
            </div>

            <!-- Overlay -->
            <div
                id="overlay"
                style="
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.3);
                    z-index: 999;
                "
                onclick="closeLocationEdit()"
            ></div>
        </main>

        <script>
            // Get URL parameters
            const params = new URLSearchParams(window.location.search);
            const iframeEnabled = params.get("iframe");
            const header = document.getElementsByClassName("app-header")[0];
            const main = document.getElementById("main");

            if (header) {
                if (iframeEnabled) {
                    // Select the first element with class "app-header"

                    // Hide the header
                    header.style.display = "none";
                } else {
                    // Remove padding
                    main.classList.add("app-container");
                    console.log(main);
                }
            }
        </script>
    </body>
</html>
