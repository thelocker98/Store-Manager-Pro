<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <!--<link rel="stylesheet" href="/static/style.css" />-->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/vendor/vendor.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 10px;
                border: 1px solid #ccc;
                text-align: left;
            }

            th {
                background-color: #f4f4f4;
            }

            button {
                margin-right: 5px;
            }

            input {
                padding: 5px;
            }
        </style>
    </head>

    <body>
        <h1>Inventory</h1>

        <!-- Add Vendor Form -->
        <h2>Add Vendor</h2>
        <form id="addVendorForm" onsubmit="addVendor(event)">
            <input
                type="text"
                id="vendor_name"
                placeholder="Vendor Name"
                required
            />
            <button type="submit">Add</button>
        </form>

        <!-- Vendors Table -->
        <h2>Vendors</h2>
        <table id="vendorsTable">
            <thead>
                <tr>
                    <th>Vendors</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Edit Vendor Popup -->
        <div
            id="editVendorPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Edit Vendor</h2>
            <form id="editVendorForm" onsubmit="submitVendorEdit(event)">
                <input type="hidden" id="editVendorId" />

                <label for="editVendorName">Vendor:</label><br />
                <input
                    type="text"
                    id="editVendorName"
                    placeholder="Vendor Name"
                    required
                /><br /><br />

                <button type="submit">Save</button>
                <button type="button" onclick="closeVendorEdit()">
                    Cancel
                </button>
            </form>
        </div>

        <!-- Optional overlay for background -->
        <div
            id="overlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeVendorEdit()"
        ></div>
    </body>
</html>
