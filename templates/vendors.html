<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <!--<link rel="stylesheet" href="/static/style.css" />-->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 10px;
                border: 1px solid #ccc;
                text-align: left;
            }

            th {
                background-color: #f4f4f4;
            }

            button {
                margin-right: 5px;
            }

            input {
                padding: 5px;
            }
        </style>
    </head>

    <body>
        <h1>Inventory</h1>

        <!-- Add Vendor Form -->
        <h2>Add Vendor</h2>
        <form id="addVendorForm" onsubmit="addVendor(event)">
            <input
                type="text"
                id="vendor_name"
                placeholder="Vendor Name"
                required
            />
            <button type="submit">Add</button>
        </form>

        <!-- Vendors Table -->
        <h2>Vendors</h2>
        <table id="vendorsTable">
            <thead>
                <tr>
                    <th>Vendors</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Edit Vendor Popup -->
        <div
            id="editVendorPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Edit Vendor</h2>
            <form id="editVendorForm" onsubmit="submitVendorEdit(event)">
                <input type="hidden" id="editVendorId" />

                <label for="editVendorName">Vendor:</label><br />
                <input
                    type="text"
                    id="editVendorName"
                    placeholder="Vendor Name"
                    required
                /><br /><br />

                <button type="submit">Save</button>
                <button type="button" onclick="closeVendorEdit()">
                    Cancel
                </button>
            </form>
        </div>

        <!-- Optional overlay for background -->
        <div
            id="overlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeVendorEdit()"
        ></div>

        <script>
            // Load all Vendors
            function loadVendors() {
                axios.get("/api/vendors").then((res) => {
                    const tbody = document.querySelector("#vendorsTable tbody");
                    tbody.innerHTML = "";
                    res.data.forEach((vendors) => {
                        tbody.innerHTML += `
                                <tr>
                                    <td>${vendors.vendor_name}</td>
                                    <td>
                                        <button onclick="editVendor(${vendors.vendor_id})">Edit</button>
                                        <button onclick="deleteVendor(${vendors.vendor_id})">Delete</button>
                                    </td>
                                </tr>
                            `;
                    });
                });
            }

            // Add Vendor
            function addVendor(e) {
                e.preventDefault();
                const vendors = {
                    vendor_name: document.getElementById("vendor_name").value,
                };
                axios.post("/api/vendors", vendors).then(() => {
                    loadVendors();
                    document.getElementById("addForm").reset();
                });
            }

            // Delete Vendors
            function deleteVendor(id) {
                if (confirm("Are you sure you want to delete this Vendor?")) {
                    axios
                        .delete(`/api/vendors/${id}`)
                        .then(() => loadVendors());
                }
            }

            // Initial load
            loadVendors();

            // Open the edit popup and fill fields
            function editVendor(id) {
                axios.get("/api/vendors").then((res) => {
                    const vendor = res.data.find((i) => i.vendor_id === id);
                    if (!vendor) return;

                    document.getElementById("editVendorId").value =
                        vendor.vendor_id;
                    document.getElementById("editVendorName").value =
                        vendor.vendor_name;

                    document.getElementById("editVendorPopup").style.display =
                        "block";
                    document.getElementById("overlay").style.display = "block";
                });
            }

            // Close the popup
            function closeVendorEdit() {
                document.getElementById("editVendorPopup").style.display =
                    "none";
                document.getElementById("overlay").style.display = "none";
            }

            // Submit edit form
            function submitVendorEdit(e) {
                e.preventDefault();
                const id = document.getElementById("editVendorId").value;
                const vendor = {
                    vendor_name:
                        document.getElementById("editVendorName").value,
                };

                axios.put(`/api/vendors/${id}`, vendor).then(() => {
                    closeVendorEdit();
                    loadVendors();
                });
            }
        </script>
    </body>
</html>
