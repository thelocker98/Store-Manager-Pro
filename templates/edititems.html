<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Add Item</title>
        <link rel="stylesheet" href="/static/css/general.css" />
        <link rel="stylesheet" href="/static/css/edititems.css" />

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/edititems/edititem.js"></script>
    </head>

    <body>
        <h1>Add Item</h1>

        <!-- Catalog Search -->
        <input
            type="text"
            id="catalogSearch"
            placeholder="Search catalog..."
            oninput="searchCatalog()"
        />

        <!-- Catalog Table -->
        <table id="catalogTable">
            <thead>
                <tr>
                    <th>UPC</th>
                    <th>Invoice Number</th>
                    <th>Name</th>
                    <th>Brand</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Collapsible Item Details -->
        <div id="itemDetails" style="display: none; margin-top: 20px">
            <h3 id="selectedCatalogTitle"></h3>

            <label>Vendor:</label>
            <select id="vendorSelect" style="width: 150px"></select>
            <button type="button" onclick="openVendorIframe()">
                + Add Vendor
            </button>

            <br />
            <label>Description</label>
            <input type="textarea" id="itemDesc" />

            <br />

            <label>Price:</label>
            <input type="number" id="itemPrice" style="width: 150px" />
            <label>Weighed Item:</label>
            <input type="checkbox" id="itemWeighed" style="width: 50px" />
            <br />

            <br />

            <label>Count:</label>
            <input type="number" id="itemCount" style="width: 200px" />
            <br />

            <button onclick="submitItem()">Submit</button>
            <button onclick="closeItem()">Cancel</button>
        </div>

        <!-- Vendor iframe modal -->
        <div
            id="vendorIframeModal"
            style="
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.3);
                z-index: 1000;
            "
        >
            <div
                style="
                    position: relative;
                    margin: 5% auto;
                    background: white;
                    width: 60%;
                    height: 80%;
                "
            >
                <iframe
                    id="vendorFrame"
                    src="/vendors"
                    style="width: 100%; height: 100%; border: 0"
                ></iframe>
                <button
                    style="position: absolute; top: 5px; right: 5px"
                    onclick="closeVendorIframe()"
                >
                    Close
                </button>
            </div>
        </div>

        <script></script>
    </body>
</html>
