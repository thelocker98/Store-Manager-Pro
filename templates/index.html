<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        button {
            margin-right: 5px;
        }

        input {
            padding: 5px;
        }
    </style>
</head>

<body>
    <h1>Inventory</h1>

    <!-- Search -->
    <input type="text" id="searchInput" placeholder="Search by name or UPC">
    <button onclick="searchItems()">Search</button>
    <button onclick="loadItems()">Reset</button>

    <!-- Add Item Form -->
    <h2>Add Item</h2>
    <form id="addForm" onsubmit="addItem(event)">
        <input type="text" id="upc" placeholder="UPC" required>
        <input type="text" id="brand" placeholder="Brand" required>
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="description" placeholder="Description">
        <input type="number" step="0.01" id="price" placeholder="Price" required>
        <button type="submit">Add</button>
    </form>

    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="exportPDF()">Export PDF</button>


    <!-- Items Table -->
    <h2>Items</h2>
    <table id="itemsTable">
        <thead>
            <tr>
                <th>UPC</th>
                <th>Brand</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Edit Item Popup -->
    <div id="editPopup" style="display:none; position:fixed; top:50%; left:50%; 
    transform:translate(-50%, -50%); background:white; border:1px solid #ccc; 
    padding:20px; z-index:1000; box-shadow: 0 0 10px rgba(0,0,0,0.5); min-width:300px;">
        <h2>Edit Item</h2>
        <form id="editForm" onsubmit="submitEdit(event)">
            <input type="hidden" id="editId">

            <label for="editUpc">UPC:</label><br>
            <input type="text" id="editUpc" placeholder="UPC" required><br><br>
            
            <label for="editBrand">Brand:</label><br>
            <input type="text" id="editBrand" placeholder="Brand" required><br><br>

            <label for="editName">Name:</label><br>
            <input type="text" id="editName" placeholder="Name" required><br><br>

            <label for="editDescription">Description:</label><br>
            <input type="text" id="editDescription" placeholder="Description"><br><br>

            <label for="editPrice">Price:</label><br>
            <input type="number" step="0.01" id="editPrice" placeholder="Price" required><br><br>

            <button type="submit">Save</button>
            <button type="button" onclick="closeEdit()">Cancel</button>
        </form>
    </div>

    <!-- Optional overlay for background -->
    <div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; 
    height:100%; background:rgba(0,0,0,0.3); z-index:999;" onclick="closeEdit()"></div>


    <script>
        // Load all items
        function loadItems() {
            axios.get('/api/items')
                .then(res => {
                    const tbody = document.querySelector('#itemsTable tbody');
                    tbody.innerHTML = '';
                    res.data.forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${item.upc}</td>
                                <td>${item.brand}</td>
                                <td>${item.name}</td>
                                <td>${item.description}</td>
                                <td>${formatPrice(item.price)}</td>
                                <td>
                                    <button onclick="editItem(${item.id})">Edit</button>
                                    <button onclick="deleteItem(${item.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        // Add Item
        function addItem(e) {
            e.preventDefault();
            const item = {
                upc: document.getElementById('upc').value,
                brand: document.getElementById('brand').value,
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value)
            };
            axios.post('/api/items', item)
                .then(() => {
                    loadItems();
                    document.getElementById('addForm').reset();
                });
        }

        // Delete Item
        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                axios.delete(`/api/items/${id}`)
                    .then(() => loadItems());
            }
        }

        // Search (simple client-side filter)
        function searchItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            axios.get('/api/items').then(res => {
                const filtered = res.data.filter(item =>
                    item.name.toLowerCase().includes(query) || item.brand.toLowerCase().includes(query) || item.upc.includes(query)
                );
                const tbody = document.querySelector('#itemsTable tbody');
                tbody.innerHTML = '';
                filtered.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.upc}</td>
                            <td>${item.brand}</td>
                            <td>${item.name}</td>
                            <td>${item.description}</td>
                            <td>${formatPrice(item.price)}</td>
                            <td>
                                <button onclick="editItem(${item.id})">Edit</button>
                                <button onclick="deleteItem(${item.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // Initial load
        loadItems();


        // Open the edit popup and fill fields
        function editItem(id) {
            axios.get('/api/items')
                .then(res => {
                    const item = res.data.find(i => i.id === id);
                    if (!item) return;

                    document.getElementById('editId').value = item.id;
                    document.getElementById('editUpc').value = item.upc;
                    document.getElementById('editBrand').value = item.brand
                    document.getElementById('editName').value = item.name;
                    document.getElementById('editDescription').value = item.description;
                    document.getElementById('editPrice').value = item.price;

                    document.getElementById('editPopup').style.display = 'block';
                    document.getElementById('overlay').style.display = 'block';
                });
        }

        // Close the popup
        function closeEdit() {
            document.getElementById('editPopup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        // Submit edit form
        function submitEdit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const item = {
                upc: document.getElementById('editUpc').value,
                brand: document.getElementById('editBrand').value,
                name: document.getElementById('editName').value,
                description: document.getElementById('editDescription').value,
                price: parseFloat(document.getElementById('editPrice').value)
            };

            axios.put(`/api/items/${id}`, item)
                .then(() => {
                    closeEdit();
                    loadItems();
                });
        }

        function formatPrice(price) {
            return '$' + price.toFixed(2);
        }

        function exportCSV() {
            window.location.href = '/api/export/csv';
        }

        function exportPDF() {
            window.location.href = '/api/export/pdf';
        }


    </script>
</body>

</html>
