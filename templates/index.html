<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <!--<link rel="stylesheet" href="/static/style.css" />-->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 10px;
                border: 1px solid #ccc;
                text-align: left;
            }

            th {
                background-color: #f4f4f4;
            }

            button {
                margin-right: 5px;
            }

            input {
                padding: 5px;
            }
        </style>
    </head>

    <body>
        <h1>Inventory</h1>

        <!-- Items Table -->
        <h2>Items</h2>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th>UPC</th>
                    <th>Brand</th>
                    <th>Vendor</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Bought</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Item Info Popup -->
        <div
            id="infoPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Item Details</h2>

            <div id="infoContent"></div>

            <br />
            <button id="infoEditBtn">Edit</button>
            <button id="infoDeleteBtn">Delete</button>
            <button onclick="closeInfo()">Close</button>
        </div>

        <!-- Edit Item Popup -->
        <div
            id="editPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2>Edit Item</h2>
            <form id="editForm" onsubmit="submitEdit(event)">
                <input type="hidden" id="editId" />

                <label for="editUpc">UPC:</label><br />
                <input
                    type="text"
                    id="editUpc"
                    placeholder="UPC"
                    required
                /><br /><br />

                <label for="editBrand">Brand:</label><br />
                <input
                    type="text"
                    id="editBrand"
                    placeholder="Brand"
                    required
                /><br /><br />

                <label for="editName">Name:</label><br />
                <input
                    type="text"
                    id="editName"
                    placeholder="Name"
                    required
                /><br /><br />

                <label for="editDescription">Description:</label><br />
                <input
                    type="text"
                    id="editDescription"
                    placeholder="Description"
                /><br /><br />

                <label for="editPrice">Price:</label><br />
                <input
                    type="number"
                    step="0.01"
                    id="editPrice"
                    placeholder="Price"
                    required
                /><br /><br />

                <button type="submit">Save</button>
                <button type="button" onclick="closeEdit()">Cancel</button>
            </form>
        </div>

        <!-- Optional overlay for background -->
        <div
            id="infooverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeInfo()"
        ></div>

        <!-- Optional overlay for background -->
        <div
            id="editoverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeEdit()"
        ></div>

        <script>
            // Load all items
            function loadItems() {
                axios.get("/api/items").then((res) => {
                    const tbody = document.querySelector("#itemsTable tbody");
                    tbody.innerHTML = "";
                    res.data.forEach((item) => {
                        console.log(item);

                        tbody.innerHTML += `
                        <tr onclick="openInfo(${item.id})" style="cursor:pointer">
                            <td>${item.UPC}</td>
                            <td>${item.Brand}</td>
                            <td>${item.VendorName}</td>
                            <td>${item.Name}</td>
                            <td>${item.Description}</td>
                            <td>${formatPrice(item.Price)}</td>
                            <td>${formatDate(item.ArrivedAt)}</td>
                        </tr>
                        `;
                    });
                });
            }

            // Add Item
            function addItem(e) {
                e.preventDefault();
                const item = {
                    upc: document.getElementById("upc").value,
                    brand: document.getElementById("brand").value,
                    name: document.getElementById("name").value,
                    description: document.getElementById("description").value,
                    price: parseFloat(document.getElementById("price").value),
                };
                axios.post("/api/items", item).then(() => {
                    loadItems();
                    document.getElementById("addForm").reset();
                });
            }

            // Delete Item
            function deleteItem(id) {
                if (confirm("Are you sure you want to delete this item?")) {
                    axios.delete(`/api/items/${id}`).then(() => loadItems());
                }
            }

            // Search (simple client-side filter)
            function searchItems() {
                const query = document
                    .getElementById("searchInput")
                    .value.toLowerCase();
                axios.get("/api/items").then((res) => {
                    const filtered = res.data.filter(
                        (item) =>
                            item.name.toLowerCase().includes(query) ||
                            item.brand.toLowerCase().includes(query) ||
                            item.upc.includes(query),
                    );
                    const tbody = document.querySelector("#itemsTable tbody");
                    tbody.innerHTML = "";
                    filtered.forEach((item) => {
                        tbody.innerHTML += `
                        <tr>
                            <td>${item.UPC}</td>
                            <td>${item.Brand}</td>
                            <td>${item.VendorName}</td>
                            <td>${item.Name}</td>
                            <td>${item.Description}</td>
                            <td>${formatPrice(item.Price)}</td>
                            <td>${formatDate(item.ArrivedAt)}</td>
                        </tr>
                    `;
                    });
                });
            }

            // Initial load
            loadItems();

            // Open the edit popup and fill fields
            function editItem(id) {
                axios.get("/api/items").then((res) => {
                    const item = res.data.find((i) => i.id === id);
                    if (!item) return;

                    document.getElementById("editId").value = item.id;
                    document.getElementById("editUpc").value = item.upc;
                    document.getElementById("editBrand").value = item.brand;
                    document.getElementById("editName").value = item.name;
                    document.getElementById("editDescription").value =
                        item.description;
                    document.getElementById("editPrice").value = item.price;

                    document.getElementById("editPopup").style.display =
                        "block";
                    document.getElementById("editoverlay").style.display =
                        "block";
                });
            }

            let currentInfoItem = null;

            function openInfo(id) {
                axios.get("/api/items").then((res) => {
                    const item = res.data.find((i) => i.id === id);
                    if (!item) return;

                    currentInfoItem = item;

                    document.getElementById("infoContent").innerHTML = `
                        <strong>UPC:</strong> ${item.UPC}<br />
                        <strong>Brand:</strong> ${item.Brand}<br />
                        <strong>Vendor:</strong> ${item.VendorName}<br />
                        <strong>Name:</strong> ${item.Name}<br />
                        <strong>Description:</strong> ${item.Description}<br />
                        <strong>Count:</strong> ${item.Count}<br />
                        <strong>Price:</strong> ${formatPrice(item.Price)}<br />
                        <strong>Bought:</strong> ${formatDate(item.ArrivedAt)}
                    `;

                    document.getElementById("infoEditBtn").onclick = () =>
                        editItem(item.id);
                    document.getElementById("infoDeleteBtn").onclick = () =>
                        deleteItem(item.id);

                    document.getElementById("infoPopup").style.display =
                        "block";
                    document.getElementById("infooverlay").style.display =
                        "block";
                });
            }

            function closeInfo() {
                document.getElementById("infoPopup").style.display = "none";
                document.getElementById("infooverlay").style.display = "none";
            }

            // Close the popup
            function closeEdit() {
                document.getElementById("editPopup").style.display = "none";
                document.getElementById("editoverlay").style.display = "none";
            }

            // Submit edit form
            function submitEdit(e) {
                e.preventDefault();
                const id = document.getElementById("editId").value;
                const item = {
                    upc: document.getElementById("editUpc").value,
                    brand: document.getElementById("editBrand").value,
                    name: document.getElementById("editName").value,
                    description:
                        document.getElementById("editDescription").value,
                    price: parseFloat(
                        document.getElementById("editPrice").value,
                    ),
                };

                axios.put(`/api/items/${id}`, item).then(() => {
                    closeEdit();
                    loadItems();
                });
            }

            function formatPrice(price) {
                return "$" + price.toFixed(2);
            }
            function formatDate(value) {
                const d = new Date(value);
                return d.toLocaleDateString("en-US", {
                    month: "2-digit",
                    day: "2-digit",
                    year: "2-digit",
                });
            }
        </script>
    </body>
</html>
