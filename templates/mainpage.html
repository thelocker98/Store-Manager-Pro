<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <link rel="stylesheet" href="/static/css/general.css" />
        <link rel="stylesheet" href="/static/css/mainpage.css" />

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/mainpage/mainpage.js"></script>
        <script src="/static/javascript/mainpage/edit_popup.js"></script>
        <script src="/static/javascript/mainpage/info_popup.js"></script>
        <script src="/static/javascript/mainpage/search.js"></script>
    </head>

    <body>
        <h1>Inventory</h1>

        <!-- Add Navigation Button -->
        <button type="button" onclick="window.location.href='/vendors'">
            Go to Vendors
        </button>
        <button type="button" onclick="window.location.href='/barcode'">
            Barcode Mode
        </button>

        <div id="searchDiv">
            <input type="text" id="searchInput" placeholder="Search items..." />
            <button onclick="searchItems()">Search</button>
            <button onclick="resetSearch()">Reset</button>

            <select id="sortBySelect">
                <option value="date">Sort by Arrived Date</option>
                <option value="upc">Sort by UPC</option>
                <option value="name">Sort by Name</option>
            </select>

            <label>
                <input type="checkbox" id="showDeletedCheckbox" />
                Show Deleted
            </label>
        </div>

        <!-- Items Table -->
        <h2>Items</h2>
        <button onclick="openAdditemsPopup()">Add Item</button>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th>UPC</th>
                    <th>Brand</th>
                    <th>Vendor</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Bought</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Spot for add item button when no result is found for search -->
        <div id="noResultsContainer" style="margin-top: 10px; display: none">
            <button onclick="openAdditemsPopup()">Add Item</button>
        </div>

        <!-- Item Info Popup -->
        <div
            id="infoPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 100;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <div id="infoContent"></div>

            <br />
            <button id="infoEditBtn">Edit</button>
            <button id="infoDeleteBtn">Delete</button>
            <button onclick="closeInfo()">Close</button>
            <p id="infoError" class="errorText"></p>
        </div>

        <!-- itemsPopup -->
        <div
            id="itemsPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 200;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <h2 id="itemsPopupHeader"></h2>

            <form id="itemsEntryFormPopup">
                <input type="hidden" id="popup_items_id" />

                <div>
                    <label for="popup_items_upc">UPC</label>
                    <input type="text" id="popup_items_upc" />
                </div>

                <div>
                    <label for="popup_items_invoicenumber"
                        >Invoice Number</label
                    >
                    <input type="text" id="popup_items_invoicenumber" />
                </div>

                <div>
                    <select
                        id="popup_items_vendorselector"
                        style="width: 150px"
                    ></select>
                    <button type="button" onclick="openVendorIframe()">
                        + Add Vendor
                    </button>
                </div>

                <div>
                    <label for="popup_items_brand">Brand</label>
                    <input type="text" id="popup_items_brand" required />
                </div>

                <div>
                    <label for="popup_items_name">Name</label>
                    <input type="text" id="popup_items_name" required />
                </div>

                <div>
                    <label for="popup_items_description">Description</label>
                    <textarea id="popup_items_description"></textarea>
                </div>

                <div>
                    <label for="popup_items_price">Price</label>
                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        id="popup_items_price"
                        required
                    />
                </div>

                <div>
                    <label for="popup_items_weighed">Weighed</label>
                    <input type="checkbox" id="popup_items_weighed" />
                </div>

                <div>
                    <label for="popup_items_count">Count</label>
                    <input type="number" id="popup_items_count" />
                </div>

                <div id="popup_div_items_arrived">
                    <label for="popup_items_arrivedat">Arrived</label>
                    <input type="date" id="popup_items_arrived" />
                </div>

                <div id="popup_div_items_soldout">
                    <label for="popup_items_soldout">Sold Out</label>
                    <input type="date" id="popup_items_soldout" />
                </div>

                <div class="form-actions">
                    <button type="button" onclick="closeItemsPopup()">
                        Cancel
                    </button>
                    <button id="itemsEntrySubmitButton" type="submit">
                        Add
                    </button>
                </div>
            </form>
            <p id="editError" class="errorText"></p>
        </div>

        <!-- Vendor iframe modal -->
        <div
            id="vendorIframeModal"
            style="
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.3);
                z-index: 1000;
            "
        >
            <div
                style="
                    position: relative;
                    margin: 5% auto;
                    background: white;
                    width: 60%;
                    height: 80%;
                "
            >
                <iframe
                    id="vendorFrame"
                    src="/vendors"
                    style="width: 100%; height: 100%; border: 0"
                ></iframe>
                <button
                    style="position: absolute; top: 5px; right: 5px"
                    onclick="closeVendorIframe()"
                >
                    Close
                </button>
            </div>
        </div>

        <!-- Optional overlay for background -->
        <div
            id="infooverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 99;
            "
            onclick="closeInfo()"
        ></div>

        <!-- items Overlay -->
        <div
            id="itemsOverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 199;
            "
            onclick="closeItemsPopup()"
        ></div>
    </body>
</html>
