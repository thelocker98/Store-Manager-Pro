<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <link rel="stylesheet" href="/static/css/general.css" />
        <link rel="stylesheet" href="/static/css/mainpage.css" />

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/mainpage/mainpage.js"></script>
    </head>

    <body>
        <h1>Inventory</h1>

        <!-- Add Item Button -->
        <button onclick="openAddItemIframe()">Add Item</button>

        <!-- Add Navigation Button -->
        <button type="button" onclick="window.location.href='/vendors'">
            Go to Vendors
        </button>
        <button type="button" onclick="window.location.href='/catalog'">
            Go to Catalog
        </button>

        <!-- Modal for iframe -->
        <div
            id="addItemIframeModal"
            style="
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.3);
                z-index: 1000;
            "
        >
            <div
                style="
                    position: relative;
                    margin: 5% auto;
                    width: 90%;
                    height: 90%;
                    background: white;
                "
            >
                <iframe
                    src="/items"
                    style="width: 100%; height: 100%; border: 0"
                ></iframe>
                <button
                    style="position: absolute; top: 5px; right: 5px"
                    onclick="closeAddItemIframe()"
                >
                    Close
                </button>
            </div>
        </div>

        <!-- Items Table -->
        <h2>Items</h2>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th>UPC</th>
                    <th>Brand</th>
                    <th>Vendor</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Bought</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Item Info Popup -->
        <div
            id="infoPopup"
            style="
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 1px solid #ccc;
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                min-width: 300px;
            "
        >
            <div id="infoContent"></div>

            <br />
            <button id="infoEditBtn">Edit</button>
            <button id="infoDeleteBtn">Delete</button>
            <button onclick="closeInfo()">Close</button>
        </div>

        <div id="editPopup">
            <h2>Edit Item</h2>

            <form id="editForm" onsubmit="submitEdit(event)">
                <input type="hidden" id="editId" />

                <div>
                    <label for="editUpc">UPC</label>
                    <input type="text" id="editUpc" required />
                </div>

                <div>
                    <label for="editBrand">Brand</label>
                    <input type="text" id="editBrand" required />
                </div>

                <div>
                    <label for="editName">Name</label>
                    <input type="text" id="editName" required />
                </div>

                <div>
                    <label for="editPrice">Price</label>
                    <input type="number" step="0.01" id="editPrice" required />
                </div>

                <div class="full-width">
                    <label for="editDescription">Description</label>
                    <textarea
                        id="editDescription"
                        placeholder="Enter item description..."
                    ></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="closeEdit()">Cancel</button>
                    <button type="submit">Save</button>
                </div>
            </form>
        </div>

        <!-- Optional overlay for background -->
        <div
            id="infooverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeInfo()"
        ></div>

        <!-- Optional overlay for background -->
        <div
            id="editoverlay"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                z-index: 999;
            "
            onclick="closeEdit()"
        ></div>
    </body>
</html>
