<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Inventory</title>
        <link rel="stylesheet" href="/static/css/general.css" />
        <link rel="stylesheet" href="/static/css/mainpage.css" />

        <script src="/static/javascript/axios.min.js"></script>
        <script src="/static/javascript/general.js"></script>
        <script src="/static/javascript/mainpage/mainpage.js"></script>
        <script src="/static/javascript/mainpage/edit_popup.js"></script>
        <script src="/static/javascript/mainpage/info_popup.js"></script>
        <script src="/static/javascript/mainpage/pagemanagement.js"></script>
        <script src="/static/javascript/mainpage/search.js"></script>
        <script src="/static/javascript/mainpage/barcode.js"></script>
    </head>

    <body>
        <header class="app-header">
            <div class="header-left">
                <span class="logo">Store Manager Pro</span>
            </div>

            <nav class="header-nav">
                <a href="/" class="nav-link">Inventory</a>
                <a href="/vendors" class="nav-link">Vendors</a>
                <a href="/locations" class="nav-link">Locations</a>
                <a href="/lists" class="nav-link">Lists</a>
                <a href="/barcode" class="nav-link" id="barcodeLink">Barcode</a>
                <a href="/export" class="nav-link">Export</a>
            </nav>
        </header>

        <main class="app-container">
            <!-- Items Table -->
            <div class="page-header">
                <h2>Inventory</h2>

                <div class="search">
                    <span
                        class="material-symbol searchButton"
                        onclick="reloadData()"
                        >&#xE8B6;</span
                    >
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search"
                    />
                    <span onclick="resetSearch()" style="cursor: pointer"
                        >X
                    </span>
                </div>
            </div>

            <div
                id="paginationControls"
                style="
                    margin-top: 15px;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                "
            >
                <div>
                    <!-- Sortby Selector -->
                    <select id="sortBySelect">
                        <option value="date">Sort by Arrived Date</option>
                        <option value="upc">Sort by UPC</option>
                        <option value="name">Sort by Name</option>
                    </select>

                    <!-- Show Deleted Items Check Box -->
                    <div class="checkbox-group">
                        <label
                            style="padding-left: 10px; font-size: 20px"
                            for="showDeletedCheckbox"
                            >Show Deleted</label
                        >
                        <input type="checkbox" id="showDeletedCheckbox" />
                    </div>
                </div>

                <div>
                    <button onclick="openAdditemPopup()" class="addItem">
                        Add Item
                    </button>
                </div>

                <div>
                    <!-- Next and Previous buttons for Pages -->
                    <button id="prevPageBtn" onclick="prevPage()" disabled>
                        Previous
                    </button>
                    <span id="pageIndicator">Page 1/1</span>
                    <button id="nextPageBtn" onclick="nextPage()">Next</button>

                    <!-- Items Per Page Selector -->
                    <span id="itemsPerPageText">View:</span>
                    <select id="itemsPerPageSelector">
                        <option value="2">2</option>
                        <option value="10">10</option>
                        <option selected="selected" value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>

            <table id="itemsTable">
                <thead>
                    <tr>
                        <th>UPC</th>
                        <th>Vendor</th>
                        <th>Brand</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Bought</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <!-- Spot for add item button when no result is found for search -->
            <div
                id="noResultsContainer"
                style="margin-top: 10px; display: none"
            >
                <p id="noResultsText">No Results Found for this search.</p>
            </div>

            <button onclick="openAdditemPopup()" class="addItem">
                Add Item
            </button>

            <!-- Item Info Popup -->
            <div id="infoPopup" class="infoPopup">
                <div id="infoContent"></div>

                <br />
                <div>
                    <button id="infoEditBtn">Edit</button>
                    <button id="infoDeleteBtn">Delete</button>
                    <button onclick="closeInfo()">Close</button>
                </div>
                <p id="infoError" class="errorText"></p>
            </div>

            <!-- itemPopup -->
            <div id="itemPopup" class="itemPopup">
                <h2 id="itemPopupHeader"></h2>

                <form id="itemEntryFormPopup">
                    <input type="hidden" id="popup_items_id" />

                    <div class="container">
                        <div style="display: flex">
                            <label for="popup_items_brand">Brand:</label>
                            <input
                                type="text"
                                id="popup_items_brand"
                                required
                            />
                        </div>

                        <div style="display: flex">
                            <label for="popup_items_name">Name:</label>
                            <input type="text" id="popup_items_name" required />
                        </div>
                    </div>

                    <div class="container">
                        <div style="display: flex">
                            <label for="popup_items_upc">UPC:</label>
                            <input type="text" id="popup_items_upc" />
                        </div>

                        <div style="display: flex">
                            <label for="popup_items_invoicenumber"
                                >Invoice Number:</label
                            >
                            <input type="text" id="popup_items_invoicenumber" />
                        </div>
                    </div>

                    <div style="display: flex; padding: 5px">
                        <!-- Vendor Selector -->
                        <div style="padding-right: 20px">
                            <label for="popup_items_vendorselector"
                                >Vendor:</label
                            >
                            <select
                                id="popup_items_vendorselector"
                                style="
                                    width: 200px;
                                    padding: 5px;
                                    overflow: hidden;
                                    border-radius: 10px;
                                "
                            ></select>
                        </div>
                        <button type="button" onclick="openIframe('vendor')">
                            + Add Vendor
                        </button>

                        <!-- Location Box -->
                        <div style="padding-right: 20px">
                            <label for="popup_items_locationselector"
                                >Location:</label
                            >
                            <select
                                id="popup_items_locationselector"
                                style="
                                    width: 200px;
                                    padding: 5px;
                                    overflow: hidden;
                                    border-radius: 10px;
                                "
                            ></select>
                        </div>
                        <button type="button" onclick="openIframe('location')">
                            + Add Location
                        </button>
                    </div>

                    <div style="display: flex; padding: 5px">
                        <label for="popup_items_description"
                            >Description:</label
                        >
                        <textarea
                            id="popup_items_description"
                            style="
                                width: 750px;
                                height: 100px;
                                padding: 10px;
                                overflow: hidden;
                                display: flex;
                                border-radius: 10px;
                                font-size: 20px;
                                box-shadow: 0 2px rgba(0, 0, 0, 0.3);
                            "
                        ></textarea>
                    </div>

                    <div class="container">
                        <div class="form-row">
                            <label for="popup_items_price">Price:</label>

                            <div class="currency-input">
                                <span class="currency-symbol">$</span>
                                <input
                                    type="number"
                                    step="0.01"
                                    min="0"
                                    id="popup_items_price"
                                    required
                                />
                            </div>

                            <div style="display: flex">
                                <input
                                    type="checkbox"
                                    id="popup_items_weighed"
                                />
                                <label for="popup_items_weighed">Weighed</label>
                            </div>
                        </div>

                        <div style="display: flex">
                            <label for="popup_items_count">Count:</label>
                            <input
                                type="number"
                                id="popup_items_count"
                                style="width: 100px; font-size: 20px"
                            />
                        </div>
                    </div>

                    <div class="container">
                        <div id="popup_div_items_arrived" style="display: flex">
                            <label for="popup_items_arrived">Arrived:</label>
                            <input type="date" id="popup_items_arrived" />
                        </div>

                        <div id="popup_div_items_soldout">
                            <label for="popup_items_soldout">Sold Out:</label>
                            <input type="date" id="popup_items_soldout" />
                        </div>
                    </div>

                    <div class="form-actions container">
                        <button type="button" onclick="closeItemPopup()">
                            Cancel
                        </button>
                        <button id="itemsEntrySubmitButton" type="submit">
                            Add
                        </button>
                    </div>
                </form>
                <p id="editError" class="errorText"></p>
            </div>

            <!-- iframe modal -->
            <div id="iframeModal">
                <iframe
                    id="popupiFrame"
                    src="/vendors?iframe=true"
                    style="width: 100%; height: 100%; border: 0"
                ></iframe>
                <button
                    style="position: absolute; top: 5px; right: 5px"
                    onclick="closeIframe()"
                >
                    Close
                </button>
            </div>

            <!-- Optional overlay for background -->
            <div
                id="infooverlay"
                style="
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.3);
                    z-index: 99;
                "
                onclick="closeInfo()"
            ></div>

            <!-- items Overlay -->
            <div
                id="itemsOverlay"
                style="
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.3);
                    z-index: 199;
                "
                onclick="closeItemPopup()"
            ></div>

            <!-- Iframe Overlay -->
            <div
                id="iframeOverlay"
                style="
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.3);
                    z-index: 999;
                "
                onclick="closeIframe()"
            ></div>
        </main>
    </body>
</html>
