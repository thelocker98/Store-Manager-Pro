version: "2"
sql:
  - engine: "postgresql"
    queries: "./query"
    schema: "schema.sql"
    gen:
      go:
        package: "sqlcdb"
        out: "sqlcdb"
        emit_json_tags: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
